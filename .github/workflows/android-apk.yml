name: Build Gokul Hub Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - gokulhub-apk-build

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare app files
        run: |
          mkdir -p www
          cp index.html style.css auth.css auth.js app.js enhancements.js www/
          cp manifest.webmanifest service-worker.js www/
          cp -R icons www/icons
          if [ -f 10276.png ]; then cp 10276.png www/; fi
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gokul-Hub-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
