<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gokul's Attendance & Salary Tracker</title>
    <!-- Include html2pdf library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- Include Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1; /* Indigo */
            --primary-dark: #4f46e5;
            --secondary: #ec4899; /* Pink */
            --accent-1: #10b981; /* Emerald */
            --accent-2: #f97316; /* Orange */
            --bg: #f3f4f6;
            --text-dark: #1f2937;
            --text-light: #f9fafb;
            --white: #ffffff;
            --danger: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-dark);
            padding: 20px;
            display: flex;
            justify-content: center;
            margin: 0;
        }

        .container {
            background-color: var(--white);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 1100px;
        }

        h2, h3 { text-align: center; color: var(--primary-dark); font-weight: 800; }
        h2 { margin-bottom: 25px; font-size: 2em;}
        h3 { margin-top: 30px; margin-bottom: 15px; font-size: 1.5em; border-bottom: 2px solid var(--primary); padding-bottom: 10px; display: inline-block;}

        /* Modern Dashboard/Summary Cards */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--white);
            border-radius: 15px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            border: 2px solid transparent;
            transition: transform 0.3s ease, border-color 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card i { font-size: 2.5em; margin-bottom: 10px; }
        .card .value { font-size: 2.2em; font-weight: 800; color: var(--text-dark); }
        .card .label { font-size: 1em; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: 1px; }

        .card-days    { border-color: var(--primary); color: var(--primary); }
        .card-reg-hrs { border-color: var(--accent-1); color: var(--accent-1); }
        .card-ot-hrs  { border-color: var(--accent-2); color: var(--accent-2); }
        .card-salary  { border-color: var(--secondary); color: var(--secondary); background: linear-gradient(135deg, #fce7f3 0%, #ffffff 100%); }
        .card-salary .value { color: var(--secondary); }

        /* Modern Table styling */
        .table-container { overflow-x: auto; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #e5e7eb;}
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            min-width: 900px;
        }
        th, td { padding: 15px; text-align: center; border-bottom: 1px solid #e5e7eb; }
        th { background-color: #f9fafb; color: #4b5563; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;}
        
        /* Highlight Net Hrs and Total Earned */
        td.net-hrs { font-weight: bold; color: var(--primary-dark); }
        td.total-earned { font-weight: 800; color: var(--white); background-color: var(--accent-1); border-radius: 6px; }

        tr:nth-child(even) { background-color: #f9fafb; }
        tr:hover { background-color: #f3f4f6; }

        /* Input Form styling */
        .entry-form {
            background-color: #f9fafb;
            padding: 25px;
            border-radius: 15px;
            border: 1px solid #e5e7eb;
            margin-top: 20px;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
        }

        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 14px; font-weight: 600; color: #4b5563; display: flex; align-items: center; gap: 8px; }
        .form-group label i { color: var(--primary); }

        input {
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.2s;
        }
        input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1); }

        .rates-config {
            grid-column: 1 / -1;
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px dashed #d1d5db;
        }

        /* Standardized colorful buttons */
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .btn-primary { background-color: var(--primary); color: var(--white); }
        .btn-primary:hover { background-color: var(--primary-dark); transform: translateY(-2px); }
        
        .btn-accent { background-color: var(--accent-1); color: var(--white); }
        .btn-accent:hover { background-color: #059669; transform: translateY(-2px); }
        
        .btn-danger { background-color: var(--danger); color: var(--white); }
        .btn-danger:hover { background-color: #b91c1c; transform: translateY(-2px); }
        
        .action-center {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            gap: 20px;
            flex-wrap: wrap;
        }

        /* PDF Styles - Make sure it still looks clean for download */
        @media print {
            body { background: white; padding: 0; }
            .container { box-shadow: none; border: none; padding: 0; }
            .entry-form, .action-center, hr, h3 { display: none !important; }
            table { font-size: 12px; }
            th { background-color: #f3f4f6 !important; -webkit-print-color-adjust: exact; }
            td.total-earned { background-color: #10b981 !important; color: white !important; -webkit-print-color-adjust: exact; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Printable Content -->
    <div id="ledger-content">
        <h2>Gokul's Monthly Ledger</h2>
        
        <!-- Modern Colorful Dashboard -->
        <div class="dashboard">
            <div class="card card-days">
                <i class="fas fa-calendar-check"></i>
                <div class="value" id="total-days">0</div>
                <div class="label">Days Worked</div>
            </div>
            <div class="card card-reg-hrs">
                <i class="fas fa-clock"></i>
                <div class="value" id="total-reg-hours">0</div>
                <div class="label">Regular Hrs</div>
            </div>
            <div class="card card-ot-hrs">
                <i class="fas fa-user-clock"></i>
                <div class="value" id="total-ot-hours">0</div>
                <div class="label">OT Hrs</div>
            </div>
            <div class="card card-salary">
                <i class="fas fa-money-bill-wave"></i>
                <div class="value">₹<span id="total-salary">0.00</span></div>
                <div class="label">Total Salary</div>
            </div>
        </div>

        <div class="table-container">
            <table id="attendance-table">
                <thead>
                    <tr>
                        <th style="text-align: left;">Date</th>
                        <th>Time (In - Out)</th>
                        <th>Total Hrs</th>
                        <th style="color: var(--danger);">Break (Hrs)</th>
                        <th>Net Hrs</th>
                        <th style="color: var(--accent-2);">OT Hrs</th>
                        <th>Base Pay (₹)</th>
                        <th>OT Pay (₹)</th>
                        <th>Total (₹)</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Entries appear here -->
                </tbody>
            </table>
        </div>
    </div>

    <hr style="margin: 40px 0; border: none; border-top: 1px solid #e5e7eb;">

    <div style="text-align: center;"><h3>Add Daily Shift</h3></div>
    
    <div class="entry-form">
        <div class="form-grid">
            <!-- Rates Config -->
            <div class="rates-config">
                <div class="form-group">
                    <label for="baseSalary"><i class="fas fa-hand-holding-usd"></i> Base Salary (for 8 hrs) ₹</label>
                    <input type="number" id="baseSalary" placeholder="500" onchange="saveRates()" required>
                </div>
                <div class="form-group">
                    <label for="otRate"><i class="fas fa-plus-circle"></i> OT Rate (per hour) ₹</label>
                    <input type="number" id="otRate" placeholder="100" onchange="saveRates()" required>
                </div>
            </div>

            <!-- Daily Entry -->
            <div class="form-group">
                <label for="date"><i class="fas fa-calendar-day"></i> Date</label>
                <input type="date" id="date" required>
            </div>
            <div class="form-group">
                <label for="inTime"><i class="fas fa-sign-in-alt"></i> In Time</label>
                <input type="time" id="inTime" value="09:30" required>
            </div>
            <div class="form-group">
                <label for="outTime"><i class="fas fa-sign-out-alt"></i> Out Time</label>
                <input type="time" id="outTime" value="18:00" required>
            </div>
            <div class="form-group" style="justify-content: flex-end;">
                <button class="btn btn-primary" onclick="addEntry()"><i class="fas fa-plus"></i> Add Shift</button>
            </div>
        </div>
    </div>

    <div class="action-center">
        <button class="btn btn-accent" onclick="downloadPDF()"><i class="fas fa-file-download"></i> Download Ledger PDF</button>
        <button class="btn btn-danger" onclick="clearData()"><i class="fas fa-trash-alt"></i> Clear All Data</button>
    </div>
</div>

<script>
    let records = JSON.parse(localStorage.getItem('ledgerRecordsVColorful')) || [];
    
    // Load saved rates on startup
    document.getElementById('baseSalary').value = localStorage.getItem('savedBaseSalary') || '';
    document.getElementById('otRate').value = localStorage.getItem('savedOTRate') || '';
    
    // Auto-fill today's date
    document.getElementById('date').valueAsDate = new Date();

    updateUI();

    function saveRates() {
        localStorage.setItem('savedBaseSalary', document.getElementById('baseSalary').value);
        localStorage.setItem('savedOTRate', document.getElementById('otRate').value);
    }

    function formatTimeAMPM(timeString) {
        const [hourString, minute] = timeString.split(":");
        const hour = +hourString % 24;
        return (hour % 12 || 12) + ":" + minute + (hour < 12 ? "am" : "pm");
    }

    function calculateShiftDetails(inTime, outTime) {
        const start = new Date(`1970-01-01T${inTime}:00`);
        let end = new Date(`1970-01-01T${outTime}:00`);
        
        if (end < start) end.setDate(end.getDate() + 1); // Overnight shift

        const grossHours = (end - start) / (1000 * 60 * 60); 
        let breakHours = 0;
        
        // Deduct 30 minutes (0.5 hrs) break if they worked more than 4 hours
        if (grossHours > 4) {
            breakHours = 0.5; 
        }
        
        let netHours = grossHours - breakHours;
        if (netHours < 0) netHours = 0;

        // Split into regular (max 8) and OT hours
        const regHours = Math.min(netHours, 8);
        const otHours = Math.max(0, netHours - 8);

        return { grossHours, breakHours, netHours, regHours, otHours };
    }

    function addEntry() {
        const date = document.getElementById('date').value;
        const inTime = document.getElementById('inTime').value;
        const outTime = document.getElementById('outTime').value;
        const baseSalary = parseFloat(document.getElementById('baseSalary').value);
        const otRate = parseFloat(document.getElementById('otRate').value);

        if (!date || !inTime || !outTime || isNaN(baseSalary) || isNaN(otRate)) {
            alert("Please fill in all fields including Salary and OT rates.");
            return;
        }

        saveRates();

        const { grossHours, breakHours, netHours, regHours, otHours } = calculateShiftDetails(inTime, outTime);
        
        const baseEarned = (regHours / 8) * baseSalary; 
        const otEarned = otHours * otRate;
        const totalEarned = baseEarned + otEarned;

        records.push({ 
            date, inTime, outTime, grossHours, breakHours, netHours, regHours, otHours, baseEarned, otEarned, totalEarned 
        });
        
        records.sort((a, b) => new Date(a.date) - new Date(b.date));
        
        saveData();
        updateUI();

        document.getElementById('inTime').value = '09:30';
        document.getElementById('outTime').value = '18:00';
    }

    function updateUI() {
        const tbody = document.getElementById('table-body');
        tbody.innerHTML = '';
        
        let totalSalary = 0;
        let totalRegHours = 0;
        let totalOtHours = 0;

        records.forEach(record => {
            totalSalary += record.totalEarned;
            totalRegHours += record.regHours;
            totalOtHours += record.otHours;
            
            const timeStr = `${formatTimeAMPM(record.inTime)} - ${formatTimeAMPM(record.outTime)}`;

            const row = `<tr>
                            <td style="text-align: left; font-weight: 600;">${record.date}</td>
                            <td>${timeStr}</td>
                            <td>${record.grossHours.toFixed(1)}</td>
                            <td style="color: var(--danger); font-weight: bold;">-${record.breakHours.toFixed(1)}</td>
                            <td class="net-hrs">${record.netHours.toFixed(1)}</td>
                            <td style="color: var(--accent-2); font-weight: 600;">${record.otHours.toFixed(1)}</td>
                            <td>₹${record.baseEarned.toFixed(2)}</td>
                            <td>₹${record.otEarned.toFixed(2)}</td>
                            <td class="total-earned">₹${record.totalEarned.toFixed(2)}</td>
                         </tr>`;
            tbody.innerHTML += row;
        });

        document.getElementById('total-days').innerText = records.length;
        document.getElementById('total-reg-hours').innerText = totalRegHours.toFixed(1);
        document.getElementById('total-ot-hours').innerText = totalOtHours.toFixed(1);
        document.getElementById('total-salary').innerText = totalSalary.toFixed(2);
    }

    function saveData() {
        localStorage.setItem('ledgerRecordsVColorful', JSON.stringify(records));
    }

    function clearData() {
        if (confirm("Are you sure you want to delete all attendance data? This cannot be undone.")) {
            records = [];
            saveData();
            updateUI();
        }
    }

    function downloadPDF() {
        const element = document.getElementById('ledger-content');
        const opt = {
            margin:       10,
            filename:     'Gokul_Monthly_Ledger.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2 },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'landscape' }
        };

        html2pdf().set(opt).from(element).save();
    }
</script>

</body>
</html>
